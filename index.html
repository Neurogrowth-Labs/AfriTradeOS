<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/afritradeos.jpeg" />
    <link rel="apple-touch-icon" href="/afritradeos.jpeg" />
    <title>AfriTradeOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              trade: {
                primary: '#070707', // Institutional black
                secondary: '#15110A', // Dark gold surface
                accent: '#C9A24D',  // Pan-African Gold
                success: '#1FA971',
                warning: '#F5A623',
                error: '#D64545',
                bg: '#0B0B0B',
                surface: '#111111'
              },
              slate: {
                750: '#2d3748', 
                850: '#1a202c', 
                950: '#0f172a',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['General Sans', 'Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
      @import url('https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700,800&display=swap');
      :root {
        color: var(--text-primary);
        font-size: 16px;
        line-height: 1.6;
        letter-spacing: 0.002em;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        position: relative;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: var(--noise-opacity);
        background-image:
          radial-gradient(circle at 20% 20%, rgba(201, 162, 77, 0.28) 0.5px, transparent 0.8px),
          radial-gradient(circle at 80% 30%, rgba(247, 231, 177, 0.16) 0.5px, transparent 0.8px),
          radial-gradient(circle at 30% 80%, rgba(201, 162, 77, 0.2) 0.5px, transparent 0.8px);
        background-size: 18px 18px, 22px 22px, 26px 26px;
        mix-blend-mode: multiply;
        z-index: 0;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'General Sans', 'Inter', sans-serif;
        color: var(--text-primary);
        letter-spacing: -0.02em;
      }
      #root {
        position: relative;
        z-index: 1;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .type-hero {
        font-family: 'General Sans', 'Inter', sans-serif;
        font-size: clamp(3rem, 5vw, 4.5rem);
        line-height: 1.08;
        letter-spacing: -0.03em;
        font-weight: 700;
      }
      .type-title {
        font-family: 'General Sans', 'Inter', sans-serif;
        font-size: clamp(1.75rem, 2.4vw, 2.5rem);
        line-height: 1.18;
        letter-spacing: -0.015em;
        font-weight: 700;
      }
      .type-header {
        font-family: 'General Sans', 'Inter', sans-serif;
        font-size: clamp(1.25rem, 1.8vw, 1.625rem);
        line-height: 1.32;
        letter-spacing: -0.01em;
        font-weight: 600;
      }
      .type-body {
        font-size: 0.95rem;
        line-height: 1.65;
        letter-spacing: 0.002em;
        font-weight: 400;
      }
      .type-caption {
        font-size: 0.75rem;
        line-height: 1.4;
        font-weight: 400;
        color: var(--text-secondary);
      }
      .text-secondary {
        color: var(--text-secondary);
      }
      .text-muted {
        color: var(--text-muted);
      }
      .section-shell {
        padding-block: clamp(3rem, 6vw, 6rem);
      }
      .container-shell {
        width: min(100%, 90rem);
        margin-inline: auto;
      }
      .content-shell {
        width: min(100%, 60rem);
      }
      .surface-glass {
        background: rgba(17, 17, 17, 0.82);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(201, 162, 77, 0.2);
      }
      .card-premium {
        background:
          linear-gradient(180deg, rgba(20, 20, 20, 0.98), rgba(10, 10, 10, 0.94));
        border: 1px solid var(--surface-border);
        border-radius: 1rem;
        box-shadow: var(--shadow-card);
      }

      .institutional-data-shell {
        border-radius: 1.25rem;
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
      }
      .dark .institutional-data-shell {
        background: rgba(15, 23, 42, 0.88);
      }
      .divider-soft {
        border-color: rgba(148, 163, 184, 0.16);
      }
      .input-premium {
        min-height: 3rem;
        border-radius: 0.9rem;
        border: 1px solid rgba(201, 162, 77, 0.22);
        background: rgba(10, 10, 10, 0.88);
        padding: 0.75rem 1rem;
        font-size: 0.9375rem;
        line-height: 1.5;
        transition: border-color 180ms ease-out, box-shadow 180ms ease-out, background-color 180ms ease-out, transform 180ms ease-out;
      }
      .input-premium:focus {
        outline: none;
        border-color: rgba(201, 162, 77, 0.58);
        box-shadow: 0 0 0 4px rgba(201, 162, 77, 0.12);
        background: rgba(17, 17, 17, 0.98);
      }
      .btn-primary,
      .btn-secondary,
      .btn-icon {
        transition:
          transform 180ms ease-out,
          box-shadow 180ms ease-out,
          background-color 180ms ease-out,
          border-color 180ms ease-out,
          color 180ms ease-out;
      }
      .btn-primary:hover,
      .btn-secondary:hover,
      .btn-icon:hover {
        transform: scale(1.02);
      }
      .btn-primary {
        min-height: 3rem;
        padding: 0.875rem 1.25rem;
        border-radius: 0.9rem;
        font-size: 0.9375rem;
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: -0.01em;
        box-shadow: 0 14px 28px rgba(11, 31, 51, 0.18), 0 4px 12px rgba(11, 31, 51, 0.08);
      }
      .btn-primary:hover {
        box-shadow: 0 18px 32px rgba(11, 31, 51, 0.22), 0 6px 16px rgba(11, 31, 51, 0.1);
      }
      .btn-secondary {
        min-height: 3rem;
        padding: 0.875rem 1.25rem;
        border-radius: 0.9rem;
        font-size: 0.9375rem;
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: -0.01em;
        border: 1px solid rgba(201, 162, 77, 0.26);
        color: var(--gold-soft);
        background: rgba(17, 17, 17, 0.86);
        box-shadow: var(--shadow-soft);
      }
      .btn-icon {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 0.75rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(201, 162, 77, 0.24);
        background: rgba(17, 17, 17, 0.82);
        box-shadow: var(--shadow-soft);
      }
      .dark {
        --text-primary: #F8F3E3;
        --text-secondary: rgba(248, 243, 227, 0.74);
        --text-muted: rgba(248, 243, 227, 0.52);
        --surface-base: rgba(11, 11, 11, 0.92);
        --surface-elevated: rgba(17, 17, 17, 0.96);
        --surface-border: rgba(201, 162, 77, 0.22);
        --shadow-soft: 0 14px 36px rgba(0, 0, 0, 0.38), 0 4px 16px rgba(201, 162, 77, 0.08);
        --shadow-card: 0 22px 52px rgba(0, 0, 0, 0.46), 0 0 0 1px rgba(201, 162, 77, 0.14);
      }
      .dark body::before {
        mix-blend-mode: screen;
      }
      .dark .surface-glass {
        background: rgba(17, 17, 17, 0.82);
        border-color: rgba(201, 162, 77, 0.22);
      }
      .dark .card-premium {
        background:
          linear-gradient(180deg, rgba(20, 20, 20, 0.98), rgba(10, 10, 10, 0.94));
      }
      .dark .input-premium {
        background: rgba(10, 10, 10, 0.86);
        color: #F8F3E3;
        border-color: rgba(201, 162, 77, 0.24);
      }
      .dark .input-premium:focus {
        background: rgba(17, 17, 17, 0.98);
        border-color: rgba(201, 162, 77, 0.56);
        box-shadow: 0 0 0 4px rgba(201, 162, 77, 0.12);
      }
      .dark .btn-secondary,
      .dark .btn-icon {
        background: rgba(17, 17, 17, 0.84);
        color: var(--gold-soft);
        border-color: rgba(201, 162, 77, 0.26);
      }

      .dark-gold-platform,
      .dark-gold-platform * {
        scrollbar-color: rgba(201, 162, 77, 0.55) rgba(7, 7, 7, 0.9);
      }
      .dark-gold-platform .bg-white,
      .dark-gold-platform .bg-gray-50,
      .dark-gold-platform .bg-slate-50,
      .dark-gold-platform .bg-trade-bg,
      .dark-gold-platform .bg-trade-surface {
        background-color: rgba(17, 17, 17, 0.94) !important;
      }
      .dark-gold-platform .bg-white\/85,
      .dark-gold-platform .bg-white\/90,
      .dark-gold-platform .bg-white\/80 {
        background-color: rgba(15, 15, 15, 0.9) !important;
      }
      .dark-gold-platform .text-gray-900,
      .dark-gold-platform .text-slate-900,
      .dark-gold-platform .text-trade-primary {
        color: var(--gold-soft) !important;
      }
      .dark-gold-platform .text-gray-700,
      .dark-gold-platform .text-slate-700,
      .dark-gold-platform .text-gray-600,
      .dark-gold-platform .text-slate-600 {
        color: var(--text-secondary) !important;
      }
      .dark-gold-platform .text-gray-500,
      .dark-gold-platform .text-slate-500,
      .dark-gold-platform .text-gray-400,
      .dark-gold-platform .text-slate-400 {
        color: var(--text-muted) !important;
      }
      .dark-gold-platform .border-gray-100,
      .dark-gold-platform .border-gray-200,
      .dark-gold-platform .border-slate-200,
      .dark-gold-platform .border-slate-700,
      .dark-gold-platform .border-slate-800 {
        border-color: rgba(201, 162, 77, 0.2) !important;
      }
      .dark-gold-platform .text-blue-500,
      .dark-gold-platform .text-blue-600,
      .dark-gold-platform .text-indigo-500,
      .dark-gold-platform .text-purple-600 {
        color: var(--gold) !important;
      }
      .dark-gold-platform .bg-blue-50,
      .dark-gold-platform .bg-blue-100,
      .dark-gold-platform .bg-indigo-50,
      .dark-gold-platform .bg-purple-50 {
        background-color: rgba(201, 162, 77, 0.12) !important;
      }
      .dark-gold-platform table,
      .dark-gold-platform thead,
      .dark-gold-platform tbody,
      .dark-gold-platform tr {
        color: var(--text-primary);
        border-color: rgba(201, 162, 77, 0.16) !important;
      }
      /* Custom scrollbar for data tables */
      .custom-scrollbar::-webkit-scrollbar {
        height: 6px;
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #070707;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-track {
        background: #070707;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(201, 162, 77, 0.55);
        border-radius: 3px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(201, 162, 77, 0.65);
      }
      /* Leaflet custom styles */
      .leaflet-container {
        font-family: 'Inter', sans-serif;
      }
      .custom-marker {
        background: none;
        border: none;
      }
      .leaflet-popup-content-wrapper {
        border-radius: 0.75rem;
        padding: 0;
      }
      .leaflet-popup-content {
        margin: 0;
        width: auto !important;
      }
      .leaflet-popup-tip {
        display: none;
      }
      /* Dark mode adjustments for map tiles */
      .dark .leaflet-tile {
        filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3"
  }
}
</script>
</head>
  <body class="bg-trade-bg text-trade-primary dark text-slate-50 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
